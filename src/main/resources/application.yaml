spring:
  application:
    name: discodeit

  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB # 한 번에 최대 업로드 가능 용량

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # 개발 시 update, 운영 시 validate/none
    show-sql: true
    properties:
      hibernate:
        format_sql: true    # 콘솔에 출력되는 SQL을 보기 좋게 줄바꿈 정렬
        highlight_sql: true # 콘솔에 출력되는 SQL 키워드에 색상 적용 (Spring Boot 3 / Hibernate 6 이상 지원)
        dialect: org.hibernate.dialect.PostgreSQLDialect # 최신 버전에서는 생략해도 자동 감지됨

discodeit:
  repository:
    type: file   # jcf | file
    file-directory: .discodeit

# 콘솔에 실행되는 쿼리와 바인딩되는 실제 파라미터 값을 확인하기 위한 로깅 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
